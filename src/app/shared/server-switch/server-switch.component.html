<div class="server-switch-container" (clickOutside)="closeDropdown()">
  <button
    type="button"
    class="server-switch-button"
    (click)="toggleDropdown()"
    [class.open]="isOpen()"
  >
    <svg class="server-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
      <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
      <line x1="6" y1="6" x2="6.01" y2="6"></line>
      <line x1="6" y1="18" x2="6.01" y2="18"></line>
    </svg>
    <span class="server-name">{{ selectedServer().name || 'Select Server' }}</span>
    <svg class="chevron-icon" [class.rotated]="isOpen()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  @if (isOpen()) {
    <div class="server-dropdown">
      <div class="dropdown-header">
        <span class="dropdown-title">Select Server</span>
      </div>
      
      <div class="server-list">
        @for (server of servers(); track server.id) {
          <div
            class="server-item"
            [class.selected]="server.id === selectedServer().id"
            (click)="selectServer(server)"
          >
            <div class="server-info">
              <span class="server-item-name">{{ server.name }}</span>
              <span class="server-item-url">{{ server.url }}</span>
            </div>
            @if (!server.isDefault) {
              <button
                type="button"
                class="remove-server-btn"
                (click)="removeServer($event, server)"
                title="Remove server"
              >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            }
          </div>
        }
      </div>

      @if (!showAddForm()) {
        <button
          type="button"
          class="add-server-btn"
          (click)="showAddServerForm()"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add New Server
        </button>
      }

      @if (showAddForm()) {
        <div class="add-server-form">
          <div class="form-field">
            <label for="server-name">Server Name</label>
            <input
              id="server-name"
              type="text"
              [(ngModel)]="newServerName"
              placeholder="e.g., Production Server"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label for="server-url">Server URL</label>
            <input
              id="server-url"
              type="url"
              [(ngModel)]="newServerUrl"
              placeholder="e.g., https://api.example.com"
              class="form-input"
            />
          </div>
          <div class="form-actions">
            <button
              type="button"
              class="cancel-btn"
              (click)="hideAddServerForm()"
            >
              Cancel
            </button>
            <button
              type="button"
              class="save-btn"
              (click)="addServer()"
              [disabled]="!newServerName() || !newServerUrl()"
            >
              Add Server
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
